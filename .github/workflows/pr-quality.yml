name: PR quality checks

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Lima
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      RESEND_API_KEY: re_ci_disabled
      PAYPAL_CLIENT_ID: ci_disabled
      PAYPAL_CLIENT_SECRET: ci_disabled
      GEMINI_API_KEY: ci_disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Validate A1 pilot content and safe seed
        run: |
          python3 scripts/content/test_build_a1_module1_pilot.py
          python3 -m unittest discover -s tests/content -p test_apply_a1_module1_pilot.py
          python3 -m unittest discover -s scripts/content -p 'test_a1_*teaching.py'
          python3 -m unittest discover -s tests/content -p 'test_a1_*.py'

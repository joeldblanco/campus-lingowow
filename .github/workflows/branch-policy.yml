name: Branch promotion policy

on:
  pull_request_target:
    branches:
      - main
      - dev
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  promotion-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch by default. The head of
      # the pull request is never checked out or executed in this job.
      - name: Check out trusted policy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce main promotion policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-branch-policy.mjs

name: Branch promotion policy

on:
  pull_request_target:
    branches:
      - main
      - dev
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to verify using trusted GitHub metadata
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  promotion-policy:
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch by default. The head of
      # the pull request is never checked out or executed in this job.
      - name: Check out trusted policy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce main promotion policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-branch-policy.mjs
        if: github.event_name == 'pull_request_target'

      - name: Verify promotion manually
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq '{pull_request: .}' > "$RUNNER_TEMP/promotion-event.json"
          GITHUB_EVENT_NAME=pull_request_target GITHUB_EVENT_PATH="$RUNNER_TEMP/promotion-event.json" node scripts/check-branch-policy.mjs
